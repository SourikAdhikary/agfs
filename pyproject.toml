[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agfs"
version = "0.1.0"
description = "Featherweight single-file SQLite Operating System & Transactional Kernel for AI Agents (macOS Tahoe APFS CoW, MCTS State-Tree, Bi-Temporal + HippoRAG 2 Memory, Virtual Inode Context Masking, ePCA Invariants, Saga Outbox)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sourik Adhikary" }
]
keywords = [
    "ai-agents",
    "sqlite",
    "operating-system",
    "copy-on-write",
    "mcts",
    "bitemporal-memory",
    "hipporag",
    "mcp",
    "opencode",
    "hermes",
    "claude-code",
    "context-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agfs = "agfs.interfaces.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agfs", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
